[package]
name = "brigid-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
brigid-crypto.workspace = true
brigid-identity.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
time.workspace = true
zeroize.workspace = true
helpers4 = { workspace = true, features = ["hex", "random-entropy", "time"] }
# Session tokens: SHA3-256 hash stored, base64url in the cookie.
sha3 = { workspace = true }
base64ct = { version = "1", features = ["alloc"] }

sqlx = { version = "0.8", features = [
    "sqlite",
    "runtime-tokio-rustls",
    "migrate",
    "macros",
] }

[dev-dependencies]
