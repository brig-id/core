[package]
name = "brigid-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
brigid-crypto.workspace = true
brigid-identity.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
time.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
helpers4 = { workspace = true, features = ["bytes", "hex", "random-entropy", "time"] }
# Session tokens: SHA3-256 hash stored, base64url in the cookie.
sha3 = { workspace = true }
base64ct = { version = "1", features = ["alloc"] }

# One set of statements for the two databases: the driver is chosen from the
# address at run time (`any`). SQLite is always there; PostgreSQL is the
# feature `postgres`, which only the edition made of several nodes turns on.
sqlx = { version = "0.9", features = [
    "sqlite",
    "any",
    "runtime-tokio",
    "migrate",
    "macros",
] }

[features]
# The PostgreSQL driver and schema: for forest. seedling and grove do not
# carry them.
postgres = ["sqlx/postgres", "sqlx/tls-rustls-aws-lc-rs"]
# `brigid_store::testing`, for the tests of the crates built on the store.
testing = []

[dev-dependencies]
# The import tests read a database from a file.
tempfile = "3"
