[package]
name = "brigid-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "The brig·id server every edition runs: configuration, operator commands, startup, interface, metrics"

[dependencies]
brigid-api.workspace = true
brigid-store.workspace = true
brigid-identity.workspace = true
brigid-webauthn.workspace = true
brigid-oidc.workspace = true
brigid-crypto.workspace = true

# CLI + configuration
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }

tokio.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# HTTP / TLS
axum = "0.8"
axum-server = { version = "0.9", features = ["tls-rustls"] }
tower-http = { version = "0.7", features = ["set-header"] }
# The embedded interface is compressed at build time (brigid-ui-embed); a
# client that takes no compression gets it unpacked.
flate2 = "1"
# Only used to install a default process-wide `CryptoProvider` at startup —
# see the call site in `run` for why this is needed.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
# The certificate obtained by the server itself (ACME, RFC 8555), answered
# with TLS-ALPN-01 (RFC 8737) on the TLS listener: aws-lc like the rest of
# rustls, rcgen for the challenge certificate and the CSR.
instant-acme = { version = "0.8", default-features = false, features = ["aws-lc-rs", "hyper-rustls", "rcgen"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
# The certificate's notAfter, to renew in time.
x509-parser = "0.16"

serde.workspace = true
serde_json.workspace = true
url.workspace = true
time.workspace = true
# geteuid, and dropping root for a command typed on the machine (owner.rs).
libc = "0.2"

[features]
# The store on PostgreSQL, for an edition made of several nodes (forest).
# seedling and grove leave it off and do not carry the driver.
postgres = ["brigid-store/postgres", "brigid-api/postgres"]

[dev-dependencies]
# The tests of the node mode build stored keys, and run on both databases.
zeroize.workspace = true
brigid-store = { workspace = true, features = ["testing"] }
# The backup tests build accounts and identities.
uuid.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
figment = { version = "0.10", features = ["test"] }
http-body-util = "0.1"
tempfile = "3"
# The ACME test against Pebble (tests/acme_pebble.rs): a client that trusts
# Pebble's roots and resolves the test domain to the listener.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tower = { version = "0.5", features = ["util"] }
