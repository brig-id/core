[package]
name = "brigid-oidc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
brigid-identity.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
url.workspace = true
ed25519-dalek = { version = "3", features = ["rand_core", "pkcs8", "alloc"] }
# jsonwebtoken 10 requires picking a CryptoProvider; rust_crypto matches the
# ed25519-dalek-based signing this crate already uses (no new C dependency).
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
# `OsRng` moved out of rand_core 0.10 into getrandom's `SysRng`.
rand_core = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }
base64ct = { version = "1", features = ["alloc"] }
pkcs8 = { version = "0.11", features = ["alloc"] }

[dev-dependencies]
brigid-crypto.workspace = true
