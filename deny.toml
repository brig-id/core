[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "ISC",
  "BSD-3-Clause",
  "CC0-1.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "BSL-1.0",
  # This workspace's own license.
  "AGPL-3.0-or-later",
  # brigid-crypto.
  "LGPL-3.0-or-later",
]
confidence-threshold = 0.8

[advisories]
version = 2
yanked = "deny"
ignore = [
  # rsa Marvin attack: pulled in by sqlx-macros-core (compile-time query
  # checking imports all DB backends). We do not use RSA or MySQL.
  # No fix available upstream.
  { id = "RUSTSEC-2023-0071", reason = "transitive via sqlx-macros-core; project uses SQLite only; no fix available" },
  # Timing variability in crypto-bigint 0.5.x, pulled in by p256 via jsonwebtoken's `rust_crypto`
  # feature; brigid-oidc only uses Algorithm::EdDSA, so the P-256 / ECDSA path is never executed.
  { id = "RUSTSEC-2026-0387", reason = "p256/ECDSA code path unreachable: tokens use EdDSA only" },
  # SQLite < 3.54 stale page-cache read with a crafted `-wal` file (libsqlite3-sys 0.30 via sqlx,
  # no sqlx release bundles >= 0.39). leaf opens only its own database in its own volume.
  { id = "RUSTSEC-2026-0459", reason = "needs a crafted -wal next to the database; only leaf writes its volume" },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[[bans.skip-tree]]
# webauthn-rs-core unconditionally depends on openssl via webauthn-attestation-ca
# (used for X.509 attestation certificate chain verification — not for TLS).
# All network connections in brigid use rustls; OpenSSL is never used for TLS.
# This dependency cannot be removed without replacing the webauthn-rs library.
# Tracked upstream: https://github.com/kanidm/webauthn-rs/issues
name = "openssl-sys"
reason = "transitive dep of webauthn-rs-core via webauthn-attestation-ca for X.509 attestation cert parsing; not used for TLS connections (rustls handles all TLS); no upstream alternative available"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/brig-id/crypto"]
