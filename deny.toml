[graph]
# Every feature of the workspace is checked: the PostgreSQL driver is one
# that only an edition on several nodes turns on.
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "ISC",
  "BSD-3-Clause",
  "CC0-1.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "BSL-1.0",
  # This workspace's own license.
  "AGPL-3.0-or-later",
  # brigid-crypto.
  "LGPL-3.0-or-later",
]
confidence-threshold = 0.8

[advisories]
version = 2
yanked = "deny"
# Unmaintained and unsound crates are refused wherever they are in what is
# compiled, not only as direct dependencies. No exception: an advisory that
# appears is fixed by an update, or argued here with its reason.
unmaintained = "all"
unsound = "all"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/brig-id/crypto"]
