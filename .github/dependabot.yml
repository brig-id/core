version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # sha3 0.12 dropped the `digest::core_api::CoreProxy` impl (rewrote to a
      # monolithic sponge-based struct), which breaks Hkdf<Sha3_256>/Hmac<Sha3_256>
      # construction. No fix released upstream yet — see RustCrypto/hashes.
      # Remove once hmac/hkdf regain compatibility with sha3 >=0.12.
      - dependency-name: "sha3"
        versions: [">=0.12.0"]
    groups:
      rustcrypto-traits:
        # All RustCrypto crates that share digest/crypto-common/signature traits
        # must move together — bumping one alone breaks the trait bounds of others.
        patterns:
          - "aes-gcm"
          - "aes"
          - "cipher"
          - "crypto-common"
          - "der"
          - "digest"
          - "ed25519"
          - "ed25519-dalek"
          - "hkdf"
          - "hmac"
          - "ml-dsa"
          - "ml-kem"
          - "module-lattice"
          - "pkcs8"
          - "secrecy"
          - "sha3"
          - "shake"
          - "signature"
          - "spki"
          - "x25519-dalek"
          - "zeroize"
      jsonwebtoken-major:
        # jsonwebtoken 9→10 is a major API rewrite (Validation, key types, errors)
        # that requires coordinated changes in brigid-oidc.
        patterns:
          - "jsonwebtoken"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
